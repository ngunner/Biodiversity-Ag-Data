<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pest Detection Simulation</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="map"></div>
        <div class="control-panel">
            <h2>Pest Detection Simulation</h2>
            
            <!-- File upload -->
            <div class="control-group">
                <label>Study Area</label>
                <input 
                    type="file" 
                    @change="e => loadBoundary(e.target.files[0])" 
                    accept=".geojson,.json"
                >
            </div>

            <!-- Parameters -->
            <div class="control-group">
                <label>Observation Density (per 100km² per month)</label>
                <input 
                    type="range" 
                    v-model.number="observationDensity" 
                    min="0.1" 
                    max="10" 
                    step="0.1"
                >
                <span>{{ observationDensity.toFixed(1) }}</span>
            </div>

            <div class="control-group">
                <label>Detection Rate (%)</label>
                <input 
                    type="range" 
                    v-model.number="detectionRate" 
                    min="0" 
                    max="100"
                >
                <span>{{ detectionRate }}%</span>
            </div>

            <!-- Date controls -->
            <div class="control-group">
                <label>Start Date</label>
                <input 
                    type="date" 
                    :value="startDate.toISOString().split('T')[0]"
                    @input="e => startDate = new Date(e.target.value)"
                >
            </div>

            <div class="control-group">
                <label>End Date</label>
                <input 
                    type="date" 
                    :value="endDate.toISOString().split('T')[0]"
                    @input="e => endDate = new Date(e.target.value)"
                >
            </div>

            <!-- Current date display -->
            <div class="current-date">
                {{ currentDate.toLocaleDateString() }}
            </div>

            <!-- Control buttons -->
            <div class="button-group">
                <button 
                    @click="isPlaying ? isPlaying = false : startSimulation()"
                >
                    {{ isPlaying ? 'Pause' : 'Start' }}
                </button>
                <button 
                    @click="currentDate = new Date(startDate)"
                    :disabled="isPlaying"
                >
                    Reset
                </button>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
